# OpenSSF Scorecard: an outside measure of this repository's supply-chain
# hygiene (branch protection, pinned dependencies, token permissions, ...).
# Results go to the Security tab as code-scanning alerts and are published
# for the README badge. The action refuses extra steps or top-level env
# when publishing, so this workflow stays exactly this shape.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 9 * * 1"
  # The default branch, dev: Scorecard publishes results only from there.
  push:
    branches: [dev]

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # the repository Scorecard scores
      actions: read # the workflow runs Scorecard scores
      security-events: write # upload the results to code scanning
      id-token: write # publish the results (the badge) with an OIDC token

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
